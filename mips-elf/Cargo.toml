[package]
name = "mips-elf"
version = "0.1.0"
edition = "2021"
description = "Minimal ELF writer and reader for MIPS binaries"
authors = ["Your Name <your.email@example.com>"]
license = "MIT OR Apache-2.0"

[dependencies]
mips-util = { path = "../mips-util" }
thiserror = { workspace = true }
# Industrial-strength object file handling (used by Rust compiler)
object = { workspace = true, features = ["read", "write", "elf"] }
# Keep byteorder for compatibility with existing code
byteorder = { workspace = true }
