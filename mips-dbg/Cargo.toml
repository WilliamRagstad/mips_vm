[package]
name = "mips-dbg"
version = "0.1.0"
edition = "2021"
description = "TUI debugger for MIPS virtual machine (ncurses-like UI)"
authors = ["Your Name <your.email@example.com>"]
license = "MIT OR Apache-2.0"

[[bin]]
name = "mips-dbg"
path = "src/main.rs"

[dependencies]
mips-vm = { path = "../mips-vm" }
mips-elf = { path = "../mips-elf" }
mips-isa = { path = "../mips-isa" }
mips-util = { path = "../mips-util" }
crossterm = { workspace = true }
ratatui = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true, features = ["derive"] }
# DWARF parsing for source line information in debugger
gimli = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
